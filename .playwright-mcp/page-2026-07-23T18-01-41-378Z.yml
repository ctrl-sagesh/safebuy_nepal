                        - generic [ref=f1e1380]: 16 · Behavioural Economics
                        - heading "Behavioural Economics and Human Factors in Security Decision-Making" [level=2] [ref=f1e1381]
                      - generic [ref=f1e1382]:
                        - generic [ref=f1e1383]:
                          - generic [ref=f1e1384]: Original Project Text — Behavioural Economics in Cybersecurity
                          - paragraph [ref=f1e1385]: Understanding human decision-making processes in cybersecurity contexts is crucial for developing automated systems that effectively complement rather than conflict with human expertise. Expected Utility Theory provides a normative framework for rational security decision-making, suggesting that security investments should be allocated to maximise expected value considering both the probability and impact of potential security incidents. However, empirical research consistently demonstrates that security professionals frequently deviate from purely rational choice models.
                          - paragraph [ref=f1e1386]: Prospect Theory, developed by Kahneman and Tversky, explains many of these deviations through concepts such as loss aversion, probability weighting, and reference point dependence. In cybersecurity contexts, loss aversion leads to overinvestment in preventing highly visible but statistically unlikely threats while more probable risks receive insufficient attention. The availability heuristic causes security teams to overestimate the likelihood of threats that have received recent media attention, leading to reactive security strategies.
                          - paragraph [ref=f1e1387]: Research on cognitive load and attention management in security operations has revealed that information overload and alert fatigue significantly degrade decision-making quality. As the volume of security alerts increases, analysts develop coping strategies that prioritise speed over thoroughness, potentially missing critical threats or making classification errors that leave organisations vulnerable to attack.
                          - paragraph [ref=f1e1388]: These insights from behavioural research inform the design of intelligent security systems by highlighting areas where automation can provide value while identifying aspects of security decision-making that require continued human involvement. Automated systems can help mitigate cognitive biases by providing systematic, consistent analysis approaches, but they must be designed to support rather than replace human judgment in strategic decision-making contexts.
