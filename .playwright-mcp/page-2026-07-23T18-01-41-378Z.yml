                      - generic [ref=f1e1210]:
                        - generic [ref=f1e1211]:
                          - generic [ref=f1e1212]: Original Project Text — Justification of the Study
                          - paragraph [ref=f1e1213]: The global cybersecurity landscape has undergone fundamental transformation over the past decade, with threat sophistication, attack frequency, and business impact reaching levels that existing security approaches struggle to address effectively. The 2024 global average cost of a data breach exceeded $4.88 million, representing a 10% increase from the previous year and highlighting the continued ineffectiveness of traditional security approaches. Meanwhile, the average time to identify and contain security breaches remained above 280 days, indicating that most organisations lack the capability to detect and respond to advanced threats in timeframes necessary to prevent significant damage.
                          - paragraph [ref=f1e1214]: These statistics reflect systematic limitations in current cybersecurity approaches rather than isolated implementation failures or temporary market conditions. The fundamental challenge lies in the mismatch between the scale and sophistication of modern cyber threats and the analytical capabilities of traditional security approaches that rely primarily on human expertise and signature-based detection systems.
                          - paragraph [ref=f1e1215]: From a technological and academic perspective, the development of intelligent vulnerability assessment frameworks contributes to a rapidly growing body of research in applied artificial intelligence for cybersecurity applications. While machine learning techniques have been applied to individual cybersecurity problems such as malware detection and intrusion detection, comprehensive research on integrated vulnerability assessment frameworks remains limited. Most existing academic work focuses on specific technical challenges or individual security tools rather than addressing the complete vulnerability management lifecycle from identification through remediation.
                          - paragraph [ref=f1e1216]: The interdisciplinary relevance of this research extends beyond computer science to encompass organisational psychology, decision theory, risk management, and public policy considerations. The research examines how cognitive biases affect security decision-making quality and develops technical solutions that account for these human factors.
                          - paragraph [ref=f1e1217]: On a practical level, the global shortage of qualified cybersecurity professionals, estimated at over 3.5 million unfilled positions, means that most organisations lack sufficient human resources to conduct comprehensive vulnerability assessments using traditional manual approaches. An intelligent vulnerability assessment framework that can augment limited human resources with automated analysis capabilities provides these organisations with access to sophisticated security analysis that would otherwise be unavailable due to resource constraints.
                          - paragraph [ref=f1e1218]: The research operates under realistic expectations about the capabilities and limitations of automated security systems. Cybersecurity will always remain an adversarial domain where perfect protection is theoretically impossible and practical protection requires continuous adaptation to evolving threats. The research assumes that even modest improvements in vulnerability assessment accuracy and efficiency can provide significant value when applied consistently across large numbers of security decisions over extended time periods.
                        - generic [ref=f1e1219]:
                          - generic [ref=f1e1220]:
                            - generic [ref=f1e1221]: 🏗 Multi-Angle Justification
                            - paragraph [ref=f1e1222]: "The justification builds from five angles: empirical (breach costs, detection time), systematic (failure is structural, not accidental), academic (gap in integrated frameworks), practical (3.5M professional shortage), and epistemological (realistic expectations about AI). This layered case-building is a mark of distinction-level work."
