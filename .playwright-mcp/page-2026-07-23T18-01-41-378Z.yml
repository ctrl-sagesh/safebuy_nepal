                        - generic [ref=f1e1401]: 17 · Case Study
                        - 'heading "Case Study: CrowdStrike Falcon — Cloud-Native Endpoint Protection" [level=2] [ref=f1e1402]'
                      - generic [ref=f1e1403]:
                        - generic [ref=f1e1404]:
                          - generic [ref=f1e1405]: "Original Project Text — Case Study: CrowdStrike Falcon"
                          - heading "Implementation and Approach" [level=4] [ref=f1e1406]
                          - paragraph [ref=f1e1407]: CrowdStrike represents one of the most successful implementations of machine learning and artificial intelligence in commercial cybersecurity products. Founded in 2011 by former executives from McAfee, CrowdStrike developed a "cloud-native" endpoint detection and response platform that leverages behavioural analysis, machine learning, and threat intelligence to provide real-time protection against sophisticated cyber threats.
                          - paragraph [ref=f1e1408]: The foundational philosophy recognises that traditional signature-based endpoint protection systems are fundamentally inadequate for addressing modern cyber threats that increasingly employ sophisticated evasion techniques, living-off-the-land attacks using legitimate system tools, and zero-day exploits. Rather than attempting to identify malicious software based on static characteristics, the Falcon platform focuses on analysing behavioural patterns and attack techniques to identify malicious activity regardless of the specific tools or malware employed.
                          - paragraph [ref=f1e1409]: The technical architecture employs a lightweight endpoint sensor that collects comprehensive telemetry data about all processes, network connections, file system activities, and registry modifications. This telemetry data is transmitted to CrowdStrike's cloud-based analysis platform where machine learning algorithms analyse behavioural patterns and correlate activities across multiple endpoints. The collective intelligence generated by analysing data from millions of endpoints across thousands of organisations enables detection of attack patterns that would be invisible to individual organisations operating in isolation.
                          - heading "Ethical Concerns" [level=4] [ref=f1e1410]
                          - paragraph [ref=f1e1411]: The comprehensive endpoint telemetry collection required for effective behavioural analysis necessarily involves access to detailed information about user activities, application usage patterns, and business processes. The cloud-based architecture creates potential concerns about data residency and cross-border data transfer that may conflict with regulatory requirements in certain jurisdictions. The proprietary nature of CrowdStrike's machine learning algorithms also limits organisational understanding of how security decisions are made within the platform — algorithmic opacity that can make it difficult for security teams to validate system outputs or explain security decisions to regulatory authorities.
                          - heading "Lessons for the IAVAF Framework" [level=4] [ref=f1e1412]
                          - paragraph [ref=f1e1413]: CrowdStrike demonstrates that cloud-native ML with behavioural analysis can achieve detection of sophisticated APTs that evade signature-based tools. The collective intelligence model — where every customer's attack improves protection for all others — validates the networked approach to threat intelligence integration. However, the platform's opacity and data sovereignty concerns directly inform why the IAVAF framework prioritises interpretable algorithms, confidence scoring, and data minimisation — addressing the limitations that CrowdStrike's commercial model cannot.
