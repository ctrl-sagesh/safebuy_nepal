                        - generic [ref=f1e1555]: 23 · Ethical Reflection
                        - heading "Ethical Reflection in Development" [level=2] [ref=f1e1556]
                      - generic [ref=f1e1557]:
                        - generic [ref=f1e1558]:
                          - generic [ref=f1e1559]: Original Project Text — Ethical Reflection in Development
                          - paragraph [ref=f1e1560]: The integration of predictive technologies into enterprise security presents not only technical and operational questions but also deep ethical challenges. While the framework developed in this research seeks to enable rational, data-driven security decisions, its very existence introduces risks related to privacy, algorithmic fairness, transparency, and the appropriate balance between automation and human expertise. This section provides a critical reflection on these ethical dimensions — not as an afterthought, but as a parallel inquiry that has been integrated into every phase of development through the agile methodology.
                          - paragraph [ref=f1e1561]: Privacy protection represents the most immediate ethical concern. Effective vulnerability assessment requires collecting and analysing network traffic, user behavioural patterns, and system configurations that may include personally identifiable information. The framework implements data minimisation principles, differential privacy techniques where appropriate, and was developed exclusively using anonymised security datasets — an intentional design choice that preserves privacy while maintaining analytical effectiveness and aligning with GDPR principles.
                          - paragraph [ref=f1e1562]: Algorithmic bias represents a significant and often overlooked risk in security ML systems. Training data for security applications may reflect historical biases in incident detection, systematically over-flagging activities of certain user groups or under-detecting threats targeting underrepresented systems. The evaluation of the trained models identified instances where risk scores were systematically elevated for certain activity patterns even when controlling for objective risk factors. Addressing these required comprehensive bias auditing processes and ongoing monitoring of system outputs.
                          - paragraph [ref=f1e1563]: "Model transparency and interpretability were central to the development process, informed by the finding that 94% of security professionals required confidence scores or uncertainty estimates alongside automated assessments before implementing recommendations. The framework deliberately avoids highly complex deep learning models where interpretable alternatives exist. Instead, random forest algorithms with feature importance outputs and decision tree visualisations accompany every assessment, reinforcing the principle that security professionals must understand not just what the system recommends, but why. This aligns with the principle of epistemic responsibility: users should understand the basis for automated security recommendations, not delegate judgment blindly to algorithmic systems."
                          - paragraph [ref=f1e1564]: The appropriate boundary between automation and human oversight was established through direct engagement with security professionals. 82% required explanations before implementing recommendations, indicating that the human-in-the-loop design is not merely an ethical nicety but an operational requirement. The framework therefore preserves human authority over all significant security decisions, with automation serving as analytical support rather than autonomous action.
                          - paragraph [ref=f1e1565]: In conclusion, ethical concerns were not relegated to the periphery but built into the agile development framework — shaping decisions on algorithm selection, data scope, visualisation, and the boundary between automated support and human authority. This approach affirms the belief that responsible AI in cybersecurity is not simply about avoiding harm but about actively promoting fairness, transparency, and human expertise preservation in high-stakes security environments.
