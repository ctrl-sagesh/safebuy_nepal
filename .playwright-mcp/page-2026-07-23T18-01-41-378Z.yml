                          - paragraph [ref=f1e1194]: From a practical perspective, the research addresses critical operational challenges facing enterprise security teams including alert fatigue, resource constraints, skill shortages, and the increasing sophistication of cyber threats. The framework provides organisations with actionable tools for improving their security posture while making more effective use of existing security investments and personnel.
                          - paragraph [ref=f1e1195]: The ethical framework developed as part of this research contributes to the responsible development of artificial intelligence in cybersecurity applications. By explicitly addressing issues such as algorithmic bias, transparency requirements, privacy protection, and human oversight, the research provides guidance for other researchers and practitioners developing AI-powered security systems.
