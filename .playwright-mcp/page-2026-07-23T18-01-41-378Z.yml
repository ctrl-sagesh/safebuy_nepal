                    - generic [ref=f1e1035]:
                      - generic [ref=f1e1036]:
                        - generic [ref=f1e1037]: 02 · Introduction
                        - heading "Introduction" [level=2] [ref=f1e1038]
                      - generic [ref=f1e1039]:
                        - generic [ref=f1e1040]:
                          - generic [ref=f1e1041]: Original Project Text — Introduction
                          - paragraph [ref=f1e1042]: Cybersecurity has emerged as one of the critical challenges facing organisations across the Kathmandu valley and beyond. From small enterprises to multinational corporations, the influence of cybersecurity extends far beyond technical infrastructure into business continuity, regulatory compliance, customer trust, and increasingly, artificial intelligence and data science applications. One major consequence of the exponential growth in cyber threats is the corresponding expansion of the cybersecurity industry, with global spending projected to exceed $345 billion by 2026. With the proliferation of digital platforms, cloud computing, and Internet of Things devices, attack surfaces have become more complex than ever before, with millions of potential entry points requiring continuous monitoring and assessment.
                          - paragraph [ref=f1e1043]: Despite unprecedented investment in cybersecurity technologies and personnel, organisational security remains a high-risk proposition characterised by significant uncertainty and resource constraints. Many security teams rely on reactive approaches, vendor-supplied threat signatures, recent incident reports, or institutional memory rather than proactive, data-driven vulnerability assessment methodologies. As a result, vulnerability management becomes more a process of responding to discovered breaches than a calculated, systematic approach to preventing them. This gap between available security data and effective vulnerability assessment methodologies is where artificial intelligence, machine learning, and statistical analysis offer transformative potential.
                          - paragraph [ref=f1e1044]: This thesis proposes the design and development of an intelligent automated vulnerability assessment framework that utilises comprehensive security data sources, machine learning algorithms, and continuous monitoring techniques to identify and prioritise network security vulnerabilities more systematically and accurately. The goal is to create a system that can learn from patterns in security data without the cognitive biases and resource limitations that constrain human analysts, identifying situations where proactive security measures can provide statistically significant risk reduction. The research draws from security data across multiple enterprise environments, incorporating network traffic analysis, system configuration databases, vulnerability scanner outputs, threat intelligence feeds, and incident response records. These data sources are operationally relevant and representative of the context in the Kathmandu valley, offering the ideal foundation for developing robust vulnerability assessment capabilities.
                        - generic [ref=f1e1045]:
                          - generic [ref=f1e1046]:
                            - generic [ref=f1e1047]: 🎯 Local Context, Global Scale
                            - paragraph [ref=f1e1048]: Opening with Kathmandu valley grounds the research in the student's specific context while connecting to global spending figures — a sophisticated move that shows local relevance without limiting scope. BSc markers reward this awareness.
                          - generic [ref=f1e1049]:
                            - generic [ref=f1e1050]: 📊 Quantified Scale
                            - paragraph [ref=f1e1051]: $345 billion by 2026 — a specific, sourced statistic that establishes the global significance of the problem before narrowing to the research gap. Always cite statistics; never leave them floating without attribution.
                          - generic [ref=f1e1052]:
                            - generic [ref=f1e1053]: 🔍 The Research Gap
                            - paragraph [ref=f1e1054]: "'This gap between available security data and effective vulnerability assessment methodologies' — stated in one sentence. Every BSc project introduction needs exactly this moment: the sentence that justifies why the research exists."
                          - generic [ref=f1e1055]:
