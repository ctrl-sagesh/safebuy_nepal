                    - generic [ref=f1e1061]:
                      - generic [ref=f1e1062]:
                        - generic [ref=f1e1063]: 03 · Problem Context
                        - heading "Problem Context & Motivation" [level=2] [ref=f1e1064]
                      - generic [ref=f1e1065]:
                        - generic [ref=f1e1066]:
                          - generic [ref=f1e1067]: Original Project Text — Problem Context and Motivation
                          - paragraph [ref=f1e1068]: Most organisational vulnerability management practices are not grounded in systematic data analysis or comprehensive risk assessment methodologies. Despite access to sophisticated security monitoring tools, threat intelligence services, and extensive security datasets, many organisations fail to process or interpret this information effectively for proactive vulnerability management. More problematically, human decision-making in cybersecurity environments is subject to numerous cognitive biases and operational pressures that can compromise assessment quality and resource allocation effectiveness. Security analysts tend to focus disproportionately on recent high-profile incidents, underestimate the probability of novel attack vectors, or make prioritisation decisions based on vendor severity scores rather than organisational risk context.
                          - paragraph [ref=f1e1069]: This research aims to address the lack of structured, evidence-based vulnerability assessment tools available to enterprise security teams. By developing an intelligent system that combines traditional security analysis techniques with machine learning methodologies, this project seeks to provide a rational, data-driven alternative to intuition-based vulnerability management approaches. In pursuing this objective, the research explores how concepts from computer science, behavioural psychology, and organisational risk management can converge to address a practical problem that is both technically challenging and operationally critical for modern organisations.
                        - generic [ref=f1e1070]:
                          - generic [ref=f1e1071]:
                            - generic [ref=f1e1072]: ⚠ Gap as Failure Mode
                            - paragraph [ref=f1e1073]: The gap is framed not as an abstract academic absence, but as a practical failure mode — security teams making suboptimal decisions due to bias and reactive approaches. This grounds the research in real operational consequences.
                          - generic [ref=f1e1074]:
                            - generic [ref=f1e1075]: 🧠 Behavioural Psychology Entry
                            - paragraph [ref=f1e1076]: Referencing cognitive biases and operational pressures introduces behavioural psychology from the first page — an interdisciplinary framing that distinguishes this from a purely technical project and is fully developed in Section 04.
                          - generic [ref=f1e1077]:
                            - generic [ref=f1e1078]: 🌐 Interdisciplinary Claim
                            - paragraph [ref=f1e1079]: "'Computer science, behavioural psychology, and organisational risk management' in one sentence. At BSc level, this kind of interdisciplinary framing signals intellectual maturity and broader analytical awareness."
                    - generic [ref=f1e1080]:
                      - generic [ref=f1e1081]:
                        - generic [ref=f1e1082]: 04 · Cybersecurity Theories
                        - heading "Cybersecurity Theories & Behavioural Factors in Security Decision-Making" [level=2] [ref=f1e1083]
                      - generic [ref=f1e1084]:
                        - generic [ref=f1e1085]:
                          - generic [ref=f1e1086]: Original Project Text — Cybersecurity Theories and Behavioural Factors
                          - paragraph [ref=f1e1087]: Enterprise cybersecurity is not merely a technical challenge but represents a complex form of organisational decision-making under uncertainty and adversarial conditions. Theories from cognitive psychology, behavioural economics, and decision science provide valuable insights into why security teams often make suboptimal vulnerability management decisions and how intelligent automated systems can provide corrective frameworks while preserving essential human oversight and strategic thinking.
                          - paragraph [ref=f1e1088]: The Cyber Kill Chain framework provides theoretical foundation for understanding systematic vulnerability assessment. This model assumes that effective security requires comprehensive visibility across all stages of potential attacks, from initial reconnaissance through successful compromise and objective achievement. In practice, however, security teams often focus on individual vulnerability types rather than analysing systemic weaknesses across complete attack scenarios. This fragmented approach can leave organisations vulnerable to multi-stage attacks that exploit combinations of individually minor vulnerabilities to achieve significant compromise.
                          - paragraph [ref=f1e1089]: Prospect Theory, developed by Kahneman and Tversky, explains systematic deviations from rational decision-making that frequently occur in cybersecurity contexts. Security professionals are often more sensitive to potential security losses than to equivalent improvements in security posture, a phenomenon known as loss aversion. This bias leads to suboptimal resource allocation where disproportionate attention is paid to preventing high-visibility negative outcomes while more cost-effective security improvements are overlooked. Additionally, the availability heuristic and representativeness heuristic cause security teams to make vulnerability prioritisation decisions based on recent incidents or memorable attack scenarios rather than comprehensive statistical analysis.
                          - paragraph [ref=f1e1090]: The confirmation bias represents another critical limitation in human-driven vulnerability assessment, leading security analysts to prioritise information that confirms their existing beliefs about organisational threats while potentially overlooking contradictory evidence. An intelligent vulnerability assessment framework, by maintaining consistent analytical approaches across large datasets, is uniquely positioned to detect patterns and correlations that complement human expertise rather than replacing it.
