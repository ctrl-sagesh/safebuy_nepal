                        - generic [ref=f1e1279]: 12 · Methodology
                        - heading "Research Methodology — Desk-Based Agile Research" [level=2] [ref=f1e1280]
                      - generic [ref=f1e1281]:
                        - generic [ref=f1e1282]:
                          - generic [ref=f1e1283]: Original Project Text — Research Methodology
                          - paragraph [ref=f1e1284]: This study employs a comprehensive design science methodology combined with controlled experimental validation to develop, test, and evaluate the intelligent vulnerability assessment framework. The methodological approach integrates systematic literature analysis, iterative framework development, prototype implementation, empirical validation through laboratory testing, and qualitative feedback collection from cybersecurity professionals across diverse organisational contexts.
                          - paragraph [ref=f1e1285]: The methodology incorporates elements of agile software development practices adapted for academic research contexts, enabling rapid prototyping, continuous stakeholder feedback integration, and iterative refinement based on experimental results and user input. This approach is particularly well-suited to cybersecurity research, which must continuously adapt to rapidly evolving threat landscapes, emerging technologies, and changing organisational requirements while maintaining rigorous academic standards.
                          - paragraph [ref=f1e1286]: The research design follows a multi-phase approach beginning with comprehensive analysis of existing vulnerability management practices, current machine learning applications in cybersecurity, and stakeholder requirements analysis through surveys and interviews with security professionals. This foundational phase establishes baseline understanding of operational requirements, technical constraints, and success criteria that guide subsequent framework development activities.
                          - paragraph [ref=f1e1287]: Data collection and integration represent critical components of the methodology, requiring development of standardised data models, automated collection pipelines, and quality assurance processes for handling diverse security data sources. The research utilises anonymised security datasets from multiple organisational environments to ensure that framework development addresses realistic operational conditions rather than idealised laboratory scenarios. All data collection activities follow strict ethical protocols including informed consent, data minimisation, anonymisation, and secure storage procedures.
                          - paragraph [ref=f1e1288]: Machine learning model development follows established best practices for cybersecurity applications including robust validation methodologies that account for temporal dependencies, adversarial data characteristics, and class imbalance issues typical of security datasets. Multiple algorithm families are evaluated including supervised learning for known threat pattern recognition, unsupervised learning for anomaly detection, ensemble methods for improved accuracy and robustness, and deep learning approaches for complex pattern recognition.
                          - paragraph [ref=f1e1289]: Ethical evaluation is integrated throughout the methodology rather than treated as a separate consideration. Each development phase includes explicit ethical assessment covering privacy protection, algorithmic bias, transparency requirements, and human oversight mechanisms. Regular ethical review sessions with diverse stakeholders ensure that ethical considerations remain central to framework development.
                          - paragraph [ref=f1e1290]: Nonetheless, the methodology is not without its limitations. The research primarily relies on controlled laboratory environments and anonymised datasets, meaning that some operational factors in live enterprise environments cannot be directly replicated. Similarly, the ethical reflections, while rigorous, are supported by controlled user studies that may not fully capture the diversity of real-world deployment contexts.
