                            - generic [ref=f1e1495]: 📊 Operational Validation
                            - paragraph [ref=f1e1496]: SolarWinds, Target, Equifax — named real incidents investigated by FireEye validate that the type of threat intelligence integration the IAVAF framework implements has operational value at the highest level. Named incidents are more credible than abstract claims.
