                        - generic [ref=f1e1611]: 25 · Findings RQ2
                        - heading "Findings — Research Question 2 (Ethical)" [level=2] [ref=f1e1612]
                      - generic [ref=f1e1613]:
                        - generic [ref=f1e1614]:
                          - generic [ref=f1e1615]: "Original Project Text — Findings: RQ2"
                          - heading "What are the ethical implications, privacy considerations, organisational responsibilities, and societal impacts of deploying automated security assessment systems in enterprise environments?" [level=4] [ref=f1e1616]
                          - paragraph [ref=f1e1617]: The comprehensive analysis of ethical implications, privacy considerations, and organisational responsibilities reveals a complex landscape of challenges and opportunities that require proactive management throughout the development and deployment lifecycle. The research findings confirm that while intelligent security automation can provide substantial benefits for organisational cybersecurity capabilities, these systems also introduce significant ethical risks that must be carefully addressed through comprehensive governance frameworks.
                          - paragraph [ref=f1e1618]: Privacy protection emerges as the most immediate and concrete ethical challenge. The framework's requirement for extensive data collection necessarily involves processing information that may include personally identifiable data and sensitive operational intelligence. The research demonstrates that privacy-preserving techniques including differential privacy and data minimisation can provide meaningful protection while preserving analytical utility, though these approaches typically require accepting some reduction in analytical accuracy. The evaluation of differential privacy techniques revealed that calibrated statistical noise could provide strong privacy guarantees while maintaining sufficient analytical utility for most vulnerability assessment tasks.
                          - paragraph [ref=f1e1619]: Algorithmic bias assessment revealed systematic challenges in ensuring equitable treatment across different user groups and system types. The evaluation of trained machine learning models identified instances where automated risk assessments systematically assigned higher risk scores to activities by certain user groups, even when controlling for objective risk factors. These biases potentially lead to discriminatory security policies or unfair allocation of security resources. Addressing these required adversarial debiasing techniques and ongoing monitoring.
                          - paragraph [ref=f1e1620]: Transparency and explainability assessment revealed strong stakeholder preferences for interpretable AI systems. Security professionals interviewed as part of the research consistently emphasised the importance of understanding not only what vulnerabilities were identified but why the system classified them as high priority. Specifically, 82% of security professionals required some level of explanation for automated recommendations before implementing significant security changes, while 94% wanted confidence scores accompanying automated assessments.
                          - paragraph [ref=f1e1621]: Human-AI collaboration evaluation examined the appropriate balance between automation and human oversight. The research findings indicate that systems designed as decision support tools rather than autonomous agents achieved better organisational adoption and more effective outcomes. Organisations that established clear role definitions — which decisions could be automated, which required human approval, and which should remain entirely under human control — experienced smoother technology adoption.
                          - paragraph [ref=f1e1622]: However, the research also identified risks of overreliance on automated systems, including skill atrophy among security professionals, reduced situational awareness, and inappropriate delegation of critical security decisions to algorithmic systems. These outcomes, if not proactively managed, could paradoxically reduce organisational security effectiveness over time despite improved automated detection capabilities.
                          - paragraph [ref=f1e1623]: "The findings confirm H2: intelligent security automation can substantially enhance defensive capabilities, but deployment without comprehensive ethical frameworks, algorithmic transparency, and robust human oversight introduces risks including privacy violations, algorithmic discrimination, and reduced human expertise development. The framework's ethical design — data minimisation, interpretable algorithms, human-in-the-loop requirements, and ongoing bias auditing — demonstrates that these risks can be substantially mitigated without sacrificing technical effectiveness."
