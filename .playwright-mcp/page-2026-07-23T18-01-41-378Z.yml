                        - generic [ref=f1e1581]: 24 · Findings RQ1
                        - heading "Findings — Research Question 1 (Technical)" [level=2] [ref=f1e1582]
                      - generic [ref=f1e1583]:
                        - generic [ref=f1e1584]:
                          - generic [ref=f1e1585]: "Original Project Text — Findings: RQ1"
                          - heading "How can an intelligent automated vulnerability assessment framework be designed and developed using machine learning techniques to improve the accuracy, efficiency, and comprehensiveness of cybersecurity risk identification in enterprise network environments?" [level=4] [ref=f1e1586]
                          - paragraph [ref=f1e1587]: The findings of this research confirm that such a framework can be designed, developed, and deployed to achieve measurable improvements in cybersecurity effectiveness compared to traditional vulnerability management approaches.
                          - paragraph [ref=f1e1588]: The technical performance evaluation revealed significant improvements across multiple critical metrics. Vulnerability detection accuracy improved from approximately 68% using traditional signature-based scanning approaches to 89% when enhanced with machine learning analysis and multi-source data integration. This improvement reflects the framework's ability to identify vulnerability patterns and attack indicators that are invisible to individual security tools operating in isolation.
                          - paragraph [ref=f1e1589]: False positive reduction represents another area of substantial improvement, with the intelligent correlation and contextual analysis capabilities reducing false positive rates by 47% compared to traditional vulnerability scanning approaches. This reduction is particularly significant for operational security teams, as false positives consume substantial analytical resources and contribute to alert fatigue. The mean time to vulnerability identification showed dramatic improvement from an average of 3.1 days using traditional periodic scanning to 6.7 hours using the framework's continuous monitoring and real-time analysis capabilities.
                          - paragraph [ref=f1e1590]: Risk prioritisation accuracy, evaluated through comparison with expert security analyst assessments and subsequent validation through penetration testing exercises, demonstrated substantial improvement over generic vendor-supplied vulnerability scores. The framework's contextual risk assessment achieved 84% agreement with expert analyst priorities, compared to 61% agreement for vendor-supplied CVSS scores. This improvement reflects the framework's ability to consider organisational-specific factors including asset criticality, network architecture, existing security controls, and threat landscape characteristics.
                          - paragraph [ref=f1e1591]: The operational impact assessment revealed significant benefits for security team productivity. Participating organisations reported an average reduction of 43% in time spent on routine vulnerability triage and initial assessment tasks. The system also identified seventeen instances of attack techniques that had not been detected by existing security controls, including cases of lateral movement activities and data exfiltration attempts employing novel techniques specifically designed to evade traditional detection systems.
                          - paragraph [ref=f1e1592]: However, the evaluation also revealed important limitations. Model performance showed degradation when applied to network environments that differed significantly from the training data, highlighting the importance of comprehensive training data diversity. Zero-day vulnerability detection remained challenging despite anomaly detection coverage. High computational resource requirements created scalability constraints for some organisational environments.
                          - paragraph [ref=f1e1593]: Despite these limitations, the research findings provide strong evidence that intelligent automated vulnerability assessment frameworks can provide measurable improvements in cybersecurity effectiveness when properly implemented. The framework demonstrates that machine learning techniques can successfully address many limitations of traditional vulnerability management approaches while providing new capabilities for threat detection and risk assessment.
