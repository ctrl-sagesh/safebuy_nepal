                      - generic [ref=f1e1504]:
                        - generic [ref=f1e1505]: 21 · Synthesis
                        - heading "Literature Review Synthesis — Lessons from Four Case Studies" [level=2] [ref=f1e1506]
                      - generic [ref=f1e1507]:
                        - generic [ref=f1e1508]:
                          - generic [ref=f1e1509]: Original Project Text — Literature Synthesis
                          - paragraph [ref=f1e1510]: The case studies examined throughout this literature review illustrate the multifaceted nature of AI-powered vulnerability assessment, encompassing both technological promise and ethical complexity. From CrowdStrike's cloud-native collective intelligence model to Darktrace's unsupervised behavioural analysis, from IBM Watson's cautionary failure to FireEye's threat intelligence integration — each example reveals how intelligent security systems can shape detection capabilities, organisational response times, and security team effectiveness, while simultaneously introducing risks of opacity, overreliance, and adversarial adaptation.
                          - paragraph [ref=f1e1511]: These cases also demonstrate that the success of such systems depends not merely on technical sophistication, but on organisational alignment, transparency, and ethical responsibility. The Watson case study, in particular, illustrates that even technically capable systems fail when they overclaim capabilities, produce inconsistent outputs, or create integration friction that organisations cannot sustain.
                          - paragraph [ref=f1e1512]: Crucially, while these systems can uncover hidden threats and optimise security resource allocation, they also risk reinforcing algorithmic bias, creating inappropriate automation boundaries, and generating overreliance that degrades human expertise over time if not carefully governed.
                          - paragraph [ref=f1e1513]: "The lessons drawn from these real-world implementations provide both a technical blueprint and an ethical caution for the design of any intelligent vulnerability assessment framework that aspires to be both effective and responsible. The IAVAF framework directly incorporates these lessons: interpretable algorithms (responding to CrowdStrike's opacity), decision support rather than autonomous action (responding to Darktrace's Antigena risks), realistic hypothesis framing (responding to Watson's overclaiming), and continuous model retraining (responding to FireEye's adversarial adaptation challenge)."
