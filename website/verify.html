<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Seller Verification — SafeBuy Nepal</title>

  <meta name="description" content="Verify this seller's trust rating on SafeBuy Nepal before making payment" />
  <meta property="og:title" content="SafeBuy Nepal — Seller Verification" />
  <meta property="og:description" content="Check if this seller is trusted, unverified, or high risk" />
  <meta name="theme-color" content="#1565C0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F5F7FA; min-height: 100vh; font-family: 'Inter', sans-serif; }
    .page { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #fff; }

    .header {
      background: linear-gradient(135deg, #1565C0, #0D47A1);
      padding: 16px 20px; display: flex; align-items: center; gap: 12px;
    }
    .logo {
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,0.2);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-family: 'Poppins'; font-weight: 700; font-size: 16px;
    }
    .header-text h1 { color: #fff; font-family: 'Poppins'; font-weight: 700; font-size: 18px; }
    .header-text p { color: rgba(255,255,255,0.8); font-weight: 400; font-size: 13px; }

    /* Direct search box so users can check any seller without knowing the URL. */
    .search-section { padding: 16px 16px 0; }
    .search-box { display: flex; gap: 8px; }
    .search-box input {
      flex: 1; min-width: 0; height: 48px; padding: 0 16px;
      border: 1.5px solid #E2E8F0; border-radius: 14px;
      font-family: 'Inter', sans-serif; font-size: 14px; color: #1A1A1A;
      outline: none; transition: border-color .15s;
    }
    .search-box input:focus { border-color: #1565C0; }
    .search-box button {
      height: 48px; padding: 0 20px; border: none; border-radius: 14px; cursor: pointer;
      background: #1565C0; color: #fff; font-family: 'Poppins'; font-weight: 600; font-size: 15px;
    }

    .loading-state { padding: 48px 20px; text-align: center; }
    .pulse-shield { width: 64px; height: 64px; margin: 0 auto; animation: pulse 0.9s ease-in-out infinite alternate; }
    @keyframes pulse { from { transform: scale(1); opacity: .85; } to { transform: scale(1.1); opacity: 1; } }
    .loading-state p { color: #666; font-size: 14px; margin-top: 16px; }

    .result-card { margin: 16px; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .verdict-banner { padding: 20px; display: flex; align-items: center; gap: 16px; }
    .verdict-icon {
      width: 56px; height: 56px; border-radius: 50%; background: #fff; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center; font-size: 28px; font-weight: 700;
    }
    .verdict-text h2 { font-family: 'Poppins'; font-weight: 700; font-size: 18px; line-height: 1.2; }
    .verdict-text p { font-size: 13px; color: #666; margin-top: 2px; }

    .seller-details { padding: 20px; background: #fff; }
    .business-name { font-family: 'Poppins'; font-weight: 600; font-size: 18px; color: #1A1A1A; margin-bottom: 4px; }
    .phone-display { font-size: 13px; color: #666; margin-bottom: 16px; }
    .stats-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .stat-chip { padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 12px; border: 1px solid; }
    .stat-chip.reviews { background: #E8F5E9; color: #00C853; border-color: #A5D6A7; }
    .stat-chip.months { background: #EFF6FF; color: #1565C0; border-color: #90CAF9; }
    .stat-chip.complaints { background: #FFEBEE; color: #D32F2F; border-color: #FFCDD2; }
    .tier-badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 20px;
      background: #F3E5F5; color: #6A1B9A; font-weight: 600; font-size: 12px; border: 1px solid #CE93D8;
    }
    .warning-box { margin-top: 16px; padding: 14px; border-radius: 10px; background: #FFEBEE; border: 1px solid #FFCDD2; font-weight: 500; font-size: 13px; color: #D32F2F; line-height: 1.45; }
    /* Body text is dark like the app's trusted box; only the verdict label/score use the green token. */
    .confidence-box { margin-top: 16px; padding: 14px; border-radius: 10px; background: #E8F5E9; border: 1px solid #A5D6A7; font-weight: 500; font-size: 13px; color: #0A1628; line-height: 1.45; }

    .actions { padding: 16px 20px; display: flex; flex-direction: column; gap: 10px; }
    .btn-primary { width: 100%; padding: 14px; border-radius: 12px; border: none; cursor: pointer; font-family: 'Poppins'; font-weight: 600; font-size: 15px; color: #fff; background: #1565C0; }
    .btn-secondary { width: 100%; padding: 14px; border-radius: 12px; background: #fff; border: 1.5px solid #1565C0; color: #1565C0; font-family: 'Poppins'; font-weight: 600; font-size: 15px; cursor: pointer; }

    .not-found-state, .error-state { padding: 44px 24px; text-align: center; }
    .search-illustration {
      width: 100px; height: 100px; border-radius: 50%; background: #EFF6FF; margin: 0 auto 20px;
      display: flex; align-items: center; justify-content: center;
    }
    .not-found-state h2, .error-state h2 { font-family: 'Poppins'; font-weight: 600; font-size: 18px; color: #1A1A1A; }
    .not-found-state > p, .error-state > p { font-size: 13px; color: #666; margin-top: 8px; }
    .safety-tips { margin-top: 20px; text-align: left; background: #FFF8E1; border-radius: 12px; padding: 16px; border-left: 4px solid #FF8F00; }
    .safety-tips h4 { font-family: 'Poppins'; font-weight: 600; font-size: 14px; color: #FF8F00; margin-bottom: 12px; }
    .safety-tips .tip { font-size: 13px; color: #555; padding: 8px 0 8px 10px; border-left: 2px solid #FF8F00; margin-bottom: 8px; }

    .footer { padding: 20px; text-align: center; border-top: 1px solid #F0F0F0; margin-top: 16px; }
    .footer p { font-size: 12px; color: #999; }
    .footer .dl { display: inline-block; margin-top: 10px; padding: 8px 16px; border: 1.5px solid #1565C0; color: #1565C0; border-radius: 10px; font-weight: 600; font-size: 12px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="page">
    <div class="header">
      <div class="logo">SB</div>
      <div class="header-text">
        <h1>SafeBuy Nepal</h1>
        <p>Seller Verification</p>
      </div>
    </div>

    <div class="search-section">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Enter phone number or @handle" maxlength="20" />
        <button onclick="searchSeller()">Check</button>
      </div>
    </div>

    <div id="content"></div>

    <div class="footer">
      <p>Powered by SafeBuy Nepal</p>
      <p>Download the SafeBuy Nepal app for full features</p>
      <a class="dl" href="https://safebuynepal.vercel.app/#download">Download App</a>
    </div>
  </div>

  <script>
    // Firebase config. The API key is NOT a secret — the sellers collection
    // is publicly readable by Firestore security rules, so an unauthenticated
    // REST read is exactly what is intended here.
    const PROJECT_ID = 'safebuy-nepal';
    const API_KEY = 'AIzaSyD6Ww7TzJyaKODGOOkVKHNJuDud-aPKOVc';
    const SITE = 'https://safebuynepal.vercel.app';

    const shieldSVG = `<svg class="pulse-shield" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M32 4 C24 8 12 10 6 10 L6 34 C6 48 20 57 32 61 C44 57 58 48 58 34 L58 10 C52 10 40 8 32 4 Z" fill="#1565C0" opacity="0.15" stroke="#1565C0" stroke-width="2.5"/><text x="32" y="40" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="20" fill="#1565C0">SB</text></svg>`;

    const el = document.getElementById('content');

    async function init() {
      const params = new URLSearchParams(window.location.search);
      let phone = (params.get('phone') || '').replace(/\D/g, '');
      if (phone.length === 13 && phone.indexOf('977') === 0) phone = phone.slice(3);
      const handle = (params.get('handle') || '').replace(/^@/, '');
      const query = phone || handle;

      if (!query) { el.innerHTML = ''; return; }
      // Reflect the active query in the search box.
      const box = document.getElementById('searchInput');
      if (box) box.value = phone || ('@' + handle);
      showLoading();

      try {
        let seller = null;
        // Demo sellers are keyed by phone as the document ID, so a direct
        // document read is both the fastest and the most reliable path.
        if (phone) seller = await fetchByDocId(phone);
        // Fall back to a field query (covers handle lookups and any seller
        // whose document ID is not the phone number).
        if (!seller) seller = await runQuery(phone ? 'phone' : 'tiktokHandle', query);
        if (!seller && handle) {
          seller = await runQuery('instagramHandle', query)
                || await runQuery('facebookHandle', query);
        }
        if (seller) showResult(seller, query);
        else showNotFound(query);
      } catch (e) {
        showError('Could not connect. Check your internet.');
      }
    }

    // Method 1 — direct document fetch by ID (sellers use phone as doc ID).
    async function fetchByDocId(phone) {
      const url = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents/sellers/${phone}?key=${API_KEY}`;
      const res = await fetch(url);
      if (!res.ok) return null;
      const data = await res.json();
      if (data && data.fields) return parseDoc(data);
      return null;
    }

    // Method 2 — query by an equality filter on a field (fallback).
    async function runQuery(field, value) {
      const url = `https://firestore.googleapis.com/v1/projects/${PROJECT_ID}/databases/(default)/documents:runQuery?key=${API_KEY}`;
      const body = {
        structuredQuery: {
          from: [{ collectionId: 'sellers' }],
          where: { fieldFilter: { field: { fieldPath: field }, op: 'EQUAL', value: { stringValue: value } } },
          limit: 1
        }
      };
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const data = await res.json();
      if (Array.isArray(data) && data[0] && data[0].document) return parseDoc(data[0].document);
      return null;
    }

    function getNum(f) {
      if (!f) return 0;
      return parseFloat(f.integerValue || f.doubleValue || '0') || 0;
    }
    function getStr(f) { return (f && f.stringValue) || ''; }
    function getBool(f) { return (f && f.booleanValue) || false; }

    function parseDoc(doc) {
      const f = doc.fields || {};

      // Time active, from accountCreatedAt.
      let monthsActive = 0, daysActive = 0;
      if (f.accountCreatedAt && f.accountCreatedAt.timestampValue) {
        const created = new Date(f.accountCreatedAt.timestampValue);
        const diffMs = Date.now() - created.getTime();
        daysActive = Math.max(0, Math.floor(diffMs / (1000 * 60 * 60 * 24)));
        monthsActive = Math.floor(daysActive / 30);
      }

      return {
        businessName: getStr(f.businessName) || getStr(f.name) || 'Unknown Seller',
        phone: getStr(f.phone),
        trustScore: Math.round(getNum(f.trustScore)),
        trustVerdict: getStr(f.trustVerdict) || 'unverified',
        reviewCount: Math.round(getNum(f.reviewCount)),
        scamReportCount: Math.round(getNum(f.scamReportCount)),
        totalAmountLost: Math.round(getNum(f.totalAmountLost)),
        verificationTier: getStr(f.verificationTier) || 'none',
        isVerified: getBool(f.isVerified),
        monthsActive,
        daysActive,
        tiktokHandle: getStr(f.tiktokHandle),
        instagramHandle: getStr(f.instagramHandle),
        averageRating: getNum(f.averageRating)
      };
    }

    const VERDICTS = {
      trusted:    { bg: '#E8F5E9', color: '#00C853', icon: '✓', label: 'TRUSTED SELLER' },
      unverified: { bg: '#FFF8E1', color: '#FF8F00', icon: '⚠', label: 'UNVERIFIED SELLER' },
      high_risk:  { bg: '#FFEBEE', color: '#D32F2F', icon: '✕', label: 'HIGH RISK — DO NOT PAY' }
    };
    const TIERS = {
      premium: 'Premium Verified',
      identity: 'Identity Verified',
      verified: 'Verified',
      basic: 'Basic Verified',
      none: 'Unverified'
    };

    function showResult(s, query) {
      const v = VERDICTS[s.trustVerdict] || VERDICTS.unverified;

      const activeText = s.monthsActive >= 1
        ? `${s.monthsActive} Month${s.monthsActive > 1 ? 's' : ''} Active`
        : `${s.daysActive} Day${s.daysActive !== 1 ? 's' : ''} Active`;

      const complaintsChip = s.scamReportCount > 0
        ? `<span class="stat-chip complaints">${s.scamReportCount} Complaint${s.scamReportCount > 1 ? 's' : ''}</span>`
        : '';

      const warning = (s.trustVerdict === 'high_risk' && s.scamReportCount > 0)
        ? `<div class="warning-box">${s.scamReportCount} fraud complaint${s.scamReportCount > 1 ? 's' : ''}${s.totalAmountLost > 0 ? ' totalling NPR ' + s.totalAmountLost.toLocaleString() : ''} reported by the community. We strongly recommend not paying this seller.</div>`
        : '';

      const confidence = s.trustVerdict === 'trusted'
        ? `<div class="confidence-box">Clean record with ${s.reviewCount} verified review${s.reviewCount !== 1 ? 's' : ''} and zero fraud complaints.</div>`
        : '';

      const reportBtn = s.trustVerdict === 'high_risk'
        ? `<button class="btn-primary" style="background:#D32F2F" onclick="reportFraud('${escapeHtml(s.phone)}')">Report This Seller</button>`
        : '';

      el.innerHTML = `
        <div class="result-card">
          <div class="verdict-banner" style="background:${v.bg}">
            <div class="verdict-icon" style="color:${v.color}">${v.icon}</div>
            <div class="verdict-text">
              <h2 style="color:${v.color}">${v.label}</h2>
              <p>Trust Rating: ${s.trustScore}/100</p>
            </div>
          </div>
          <div class="seller-details">
            <div class="business-name">${escapeHtml(s.businessName)}</div>
            <div class="phone-display">${escapeHtml(s.phone || query)}</div>
            <div class="stats-row">
              <span class="stat-chip reviews">${s.reviewCount} Review${s.reviewCount !== 1 ? 's' : ''}</span>
              <span class="stat-chip months">${activeText}</span>
              ${complaintsChip}
            </div>
            <span class="tier-badge">⚑ ${TIERS[s.verificationTier] || 'Unverified'}</span>
            ${warning}
            ${confidence}
          </div>
          <div class="actions">
            ${reportBtn}
            <button class="btn-primary" onclick="downloadApp()">Download SafeBuy Nepal App</button>
            <button class="btn-secondary" onclick="searchAnother()">Search Another Seller</button>
          </div>
        </div>`;
    }

    function showNotFound(query) {
      el.innerHTML = `
        <div class="not-found-state">
          <div class="search-illustration">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#1565C0" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          </div>
          <h2>Seller not found</h2>
          <p>They may not be registered yet. This does not mean they are fraudulent.</p>
          <div class="safety-tips">
            <h4>Safety Tips</h4>
            <div class="tip">Ask for a video call showing the real product</div>
            <div class="tip">Start with a small test order under NPR 500</div>
            <div class="tip">Screenshot everything before paying</div>
            <div class="tip">Never pay the full amount before dispatch proof</div>
          </div>
          <div class="actions">
            <button class="btn-primary" onclick="downloadApp()">Download SafeBuy Nepal App</button>
            <button class="btn-secondary" onclick="searchAnother()">Search Another Seller</button>
          </div>
        </div>`;
    }

    function showLoading() {
      el.innerHTML = `<div class="loading-state">${shieldSVG}<p>Checking seller trust rating...</p></div>`;
    }

    function showError(msg) {
      el.innerHTML = `
        <div class="error-state">
          <div class="search-illustration" style="background:#FFEBEE">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#D32F2F" stroke-width="2"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
          </div>
          <h2>Could not connect</h2>
          <p>${escapeHtml(msg)}</p>
          <div class="actions"><button class="btn-primary" onclick="init()">Retry</button></div>
        </div>`;
    }

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    // Search box → navigate to the same page with the query, so results are
    // shareable via URL.
    function searchSeller() {
      const raw = (document.getElementById('searchInput').value || '').trim();
      if (!raw) return;
      const digits = raw.replace(/\D/g, '');
      if (digits) {
        window.location.href = `verify.html?phone=${digits}`;
      } else {
        window.location.href = `verify.html?handle=${encodeURIComponent(raw.replace(/^@/, ''))}`;
      }
    }

    function downloadApp() { window.location.href = SITE + '/#download'; }
    function searchAnother() { window.location.href = 'verify.html'; }
    function reportFraud(phone) {
      // Try to deep-link into the app; fall back to the download page.
      window.location.href = 'safebuynepal://report?phone=' + phone;
      setTimeout(function () { window.location.href = SITE + '/#download'; }, 800);
    }

    window.onload = function () {
      const box = document.getElementById('searchInput');
      if (box) {
        box.addEventListener('keypress', function (e) {
          if (e.key === 'Enter') searchSeller();
        });
      }
      init();
    };
  </script>
</body>
</html>
